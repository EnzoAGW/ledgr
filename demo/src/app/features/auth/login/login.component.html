<div class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">ledgr</div>
      <p class="subtitle">Sign in to your organization</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password">
        </mat-form-field>

        <button mat-flat-button class="submit-btn" type="submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Sign in
          }
        </button>

        @if (error()) {
          <span class="error-msg">{{ error() }}</span>
        }
      </form>
    </div>

    <div class="demo-box">
      <p class="demo-box__label">Demo credentials</p>
      @for (account of demoAccounts; track account.email) {
        <button type="button" class="demo-box__row" [disabled]="loading()" (click)="useDemoAccount(account)">
          <span class="demo-box__role">{{ account.role }}</span>
          <span class="demo-box__creds">{{ account.email }} / {{ account.password }}</span>
        </button>
      }
    </div>
  </div>
</div>
