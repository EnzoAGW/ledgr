<div class="page">
  <div class="page-header">
    <h1>Team</h1>
    <button mat-flat-button (click)="openInvite()">
      <mat-icon>person_add</mat-icon> Invite Member
    </button>
  </div>

  @if (loading()) {
    <p style="color:rgba(255,255,255,.4)">Loading…</p>
  } @else {
    <table mat-table [dataSource]="members()" style="width:100%;max-width:700px">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let m" style="font-weight:500">{{ m.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let m" style="color:rgba(255,255,255,.6)">{{ m.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let m">
          <span class="role-badge" [class]="m.role.toLowerCase()">{{ m.role }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>

    @if (!members().length) {
      <p style="color:rgba(255,255,255,.4);margin-top:16px">No team members found.</p>
    }
  }
</div>
