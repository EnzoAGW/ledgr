<div class="page">
  <div class="page-header">
    <h1>Categories</h1>
    <button mat-flat-button (click)="openCreate()">
      <mat-icon>add</mat-icon> New Category
    </button>
  </div>

  @if (loading()) {
    <p style="color:rgba(255,255,255,.4)">Loading…</p>
  } @else {
    <table mat-table [dataSource]="categories()" style="width:100%;max-width:600px">
      <ng-container matColumnDef="color">
        <th mat-header-cell *matHeaderCellDef style="width:48px"></th>
        <td mat-cell *matCellDef="let c">
          <span class="color-swatch" [style.background]="c.color"></span>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let c" style="font-weight:500">{{ c.name }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let c">
          <span class="type-badge" [class]="c.type.toLowerCase()">{{ c.type }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>

    @if (!categories().length) {
      <p style="color:rgba(255,255,255,.4);margin-top:16px">No categories yet.</p>
    }
  }
</div>
