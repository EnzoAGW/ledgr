<div class="pager">
  <div class="page-size">
    <span>Items per page:</span>
    <select [value]="pageSize" (change)="onPageSizeChange($any($event.target).value)">
      @for (opt of pageSizeOptions; track opt) {
        <option [value]="opt">{{ opt }}</option>
      }
    </select>
  </div>

  <div class="page-range">
    {{ length ? pageIndex * pageSize + 1 : 0 }}–{{ Math.min((pageIndex + 1) * pageSize, length) }} of {{ length }}
  </div>

  <div class="page-numbers">
    <button class="page-square nav" [disabled]="pageIndex === 0" (click)="goTo(pageIndex - 1)" aria-label="Previous page">‹</button>

    @for (p of pages; track p) {
      <button class="page-square" [class.active]="p === pageIndex" (click)="goTo(p)">{{ p + 1 }}</button>
    }

    <button class="page-square nav" [disabled]="pageIndex === totalPages - 1" (click)="goTo(pageIndex + 1)" aria-label="Next page">›</button>
  </div>
</div>
