services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgr
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ledgr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Database=ledgr;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5142:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
